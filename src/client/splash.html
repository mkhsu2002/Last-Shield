<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23a1f4d1' d='M32 3 57 14v20L32 61 7 34V14z'/%3E%3Cpath fill='%23071216' d='M32 13 47 20v12L32 48 17 32V20z'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="splash.css" />
    <title>Last Shield v1.02 | Daily Defense on Reddit</title>
  </head>
  <body>
    <main class="wrap" data-state="idle" aria-labelledby="splash-title">
      <header class="launch-topbar">
        <div><h1 id="splash-title">Last Shield</h1><small><span id="splash-detail">Neo Babylon ·</span> <span id="version"></span></small></div>
        <select class="language-select" aria-label="Interface language" data-no-translate><option value="en" lang="en">EN</option><option value="zh-Hant" lang="zh-Hant">繁中</option></select>
      </header>
      <section class="arena" id="inline-arena" aria-hidden="true">
        <svg class="dome" viewBox="0 0 240 110" fill="none" preserveAspectRatio="none"><path d="M3 106a117 104 0 0 1 234 0" stroke-width="2"/><path class="crack" d="m148 5 12 23-7 17 19 13-8 19m-11-32-19 8-8 25m34-50 13 1 7 9" stroke-width="2"/></svg>
        <svg class="beam" viewBox="0 0 100 100" fill="none" preserveAspectRatio="none"><line x1="50" y1="77" x2="66" y2="46" stroke-width="4" vector-effect="non-scaling-stroke"/></svg>
        <div class="rock"><img src="./art/meteor.webp" alt="" draggable="false"></div>
      </section>
      <footer class="launch-actions">
        <p id="splash-copy" role="status" aria-live="polite">Tap when the ring turns gold.</p>
        <div class="buttons">
          <button id="start" type="button">Try one meteor</button>
          <button id="expand" type="button">Open full game</button>
        </div>
        <small id="practice-note">Tap practice · no ranking</small>
      </footer>
    </main>
    <script type="module" src="splash.ts"></script>
  </body>
</html>
